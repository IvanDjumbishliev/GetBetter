services:
  - type: web
    name: getbetter
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: |
      set -eu
      echo "[deploy] Applying database migrations..."
      npx prisma migrate deploy
      echo "[deploy] Seeding sample curriculum when needed..."
      SEED_IF_EMPTY=true npx prisma db seed
      echo "[deploy] Starting web server..."
      npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
