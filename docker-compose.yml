services:
  redis:
    image: redis:7-alpine
    container_name: getbetter-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
  db:
    image: postgres:17
    container_name: getbetter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: getbetter
      POSTGRES_PASSWORD: getbetter
      POSTGRES_DB: getbetter
    ports:
      - '5433:5432'
    volumes:
      - getbetter-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getbetter -d getbetter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  getbetter-db-data:
