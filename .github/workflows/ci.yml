name: CI

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: getbetter
          POSTGRES_PASSWORD: getbetter
          POSTGRES_DB: getbetter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getbetter -d getbetter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://getbetter:getbetter@localhost:5432/getbetter_test?schema=public
      DATABASE_URL: postgresql://getbetter:getbetter@localhost:5432/getbetter_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
